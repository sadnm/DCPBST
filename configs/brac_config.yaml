# BRAC / Human Breast Cancer (10x Visium)
# Used by: dcpbst_BRAC.ipynb
# Model variant: model_827.py

# Data configuration
data_path: "data/Human_breast"  # relative to repo root
label_col: "fine_annot_type"    # column name in metadata.tsv
use_img_features: true         # Visium has H&E image features

# Model architecture
latent_dim: 1024
pca_n_components: 1000
embed_dim: 512
num_heads: 8
output_dim: 256

# Graph construction
neighbors: 7
gat_dropout: 0.5

# Training hyperparameters
epochs: 900
lr: 0.001
w_cls: 10.0
w_recon: 10.0
w_kl: 0.1
w_pro: 2.0
w_info: 3.0
w_dgi: 0.1
w_clu: 1.0
diagnose_every_n_epochs: 20

# Clustering
cluster_method: "mclust"
refine_radius: 50
n_clusters: 7  # Auto-detected from Ground Truth

# DEG contrast groups for downstream analysis
deg_group_1: "8"   # Group 8 (basal-like tumors)
deg_group_2: "12"  # Group 12 (luminal-like tumors)

# Misc
seed: 100
use_ot: false                       # Not used in current experiments
spatial_s_requires_grad: false
label_col_name: "Ground Truth"