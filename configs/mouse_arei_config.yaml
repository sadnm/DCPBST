# Mouse AREI / Brain Anterior (10x Visium)
# Used by: dcpbst_Mouse_AREI.ipynb
# Model variant: model_827.py (same as DLPFC/BRAC)

# Data configuration
data_path: "data/Mouse_Brain_Anterior"  # relative to repo root
label_col: "ground_truth"               # column name in metadata.tsv
use_img_features: true                  # Visium has H&E image features

# Model architecture (same as DLPFC/BRAC)
latent_dim: 1024
pca_n_components: 1000
embed_dim: 512
num_heads: 8
output_dim: 256

# Graph construction
neighbors: 7
gat_dropout: 0.5

# Training hyperparameters (same as DLPFC/BRAC)
epochs: 900
lr: 0.001
w_cls: 10.0
w_recon: 10.0
w_kl: 0.1
w_pro: 2.0
w_info: 3.0
w_dgi: 0.1
w_clu: 1.0
diagnose_every_n_epochs: 20

# Clustering
cluster_method: "mclust"
refine_radius: 50
n_clusters: null  # Auto-detected from Ground Truth

# Misc
seed: 100
use_ot: false                       # Not used in current experiments
spatial_s_requires_grad: false
label_col_name: "Ground Truth"